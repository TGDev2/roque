[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chesslab"
version = "0.1.0"
description = "Chess Analyzer - Screen capture and board detection"
requires-python = ">=3.11"
dependencies = [
    "mss>=9.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "python-chess>=1.10",
]

[project.scripts]
chesslab = "chesslab.app:main"
chesslab-validate = "chesslab.validation.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"chesslab.recognition" = ["templates/**/*.png", "templates/**/*.json", "themes.json"]
"chesslab.validation" = ["supported_setups.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
